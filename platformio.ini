; Khai báo môi trường gốc [env] dùng chung cho tất cả các node
[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; Tự động tải thư viện LoRa
lib_deps = sandeepmistry/LoRa@^0.8.0
; Tính năng cực hay: Hiển thị thời gian và cho phép gõ phím gửi ngay trong Terminal của VS Code
monitor_filters = time, colorize, send_on_enter 

; ========================================================
; Cấu hình riêng cho từng Node (kế thừa từ [env] ở trên)
; ========================================================

[env:node1]
build_flags = 
    ${env.build_flags}
    -D NODE_ID=1
upload_port = COM5
monitor_port = COM5

[env:node2]
build_flags = 
    ${env.build_flags}
    -D NODE_ID=2
upload_port = COM8
monitor_port = COM8

[env:node3]
build_flags = 
    ${env.build_flags}
    -D NODE_ID=3
upload_port = COM9
monitor_port = COM9